name: Optimizer Guided Pattern Cascade

on:
  push:
    branches:
      - experiment/optimizer-guided-pattern-cascade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --manifest-path native/optimizer-pattern-generator/Cargo.toml
      - run: npm run optimizer:rust:build
      - name: Guided cascade sentinels
        run: node --test research/optimizer/pattern-generators/guided-cascade/guided-p13-cascade.test.mjs
      - name: Existing guide-slice controls
        run: node --test research/optimizer/pattern-generators/guide-slice/4056900.test.mjs research/optimizer/pattern-generators/guide-slice/4057401.test.mjs
      - run: npm run typecheck
      - run: npm test
      - name: Package exact research source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-cascade-source
          path: |
            research/optimizer/pattern-generators/guided-cascade
            research/optimizer/pattern-generators/guide-slice
            research/optimizer/pattern-generators/subset-generator
            research/optimizer/pattern-generators/context.mjs
            research/optimizer/pattern-generators/ordering.mjs
            src/lib/optimizer/legacy
            src/lib/optimizer/canonical-case.ts
            src/lib/optimizer/canonical-xml.ts
            src/lib/optimizer/experience/benchmark-input.ts
          if-no-files-found: error
          retention-days: 7
