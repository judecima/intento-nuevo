name: Optimizer Master Portfolio Gate

on:
  push:
    branches:
      - experiment/optimizer-master-portfolio-gate
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect frozen corpus shape
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Master portfolio corpus inspection'
            echo
            echo "commit: $GITHUB_SHA"
            echo
            echo '~~~text'
            ls -lh experiencia/v7/all20.jsonl research/optimizer/master-portfolio/MASTER_ACTIVE_323_MANIFEST_2026-09-18.json
            wc -l experiencia/v7/all20.jsonl
            echo '--- first record ---'
            head -n 1 experiencia/v7/all20.jsonl | cut -c1-12000
            echo '--- second record ---'
            sed -n '2p' experiencia/v7/all20.jsonl | cut -c1-12000
            echo '~~~'
          } > /tmp/master-portfolio-inspection.md
      - name: Publish inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 21 --repo ${{ github.repository }} --body-file /tmp/master-portfolio-inspection.md
