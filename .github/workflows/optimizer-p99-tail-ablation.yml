name: Optimizer p99 Tail Stage Ablation

on:
  push:
    branches:
      - research/p99-tail-ablation-20260920
    paths:
      - "research/optimizer/p99-tail/**"
      - ".github/workflows/optimizer-p99-tail-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variant:
    strategy:
      fail-fast: false
      matrix:
        variant: [control, no_multislice, no_master, no_master_no_multislice]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build native optimizer
        run: npm run optimizer:rust:build
      - name: Run ${{ matrix.variant }}
        env:
          RUST_LEGACY_DEBUG_ERRORS: "1"
        run: node research/optimizer/p99-tail/p99-tail-ablation.cjs ${{ matrix.variant }}
      - name: Upload variant evidence
        uses: actions/upload-artifact@v4
        with:
          name: p99-tail-${{ matrix.variant }}
          path: research/optimizer/p99-tail/p99-tail-${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 30

  report:
    needs: variant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p99-tail-*
          path: research/optimizer/p99-tail
          merge-multiple: true
      - name: Build ablation report
        run: node research/optimizer/p99-tail/p99-tail-ablation.cjs report
      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-p99-tail-ablation
          path: research/optimizer/p99-tail/p99-tail-ablation-results.json
          if-no-files-found: error
          retention-days: 30
