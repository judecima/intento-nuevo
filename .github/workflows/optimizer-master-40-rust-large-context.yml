name: Optimizer Master 40 Rust Large Context

on:
  push:
    branches:
      - research/master40-rust-context-large-batch-20260921
    paths:
      - "native/optimizer-pattern-generator/src/legacy_packer.rs"
      - "src/lib/optimizer/legacy/rust/rust-packer.cjs"
      - "src/lib/optimizer/legacy/rust/rust-hybrid.cjs"
      - "src/lib/optimizer/legacy/rust/rust-patrones.cjs"
      - "research/optimizer/master-generation/master-large-context-gate.cjs"
      - ".github/workflows/optimizer-master-40-rust-large-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build native optimizer
        run: npm run optimizer:rust:build
      - name: Run Rust Master large-context parity gate
        env:
          RUST_LEGACY_DEBUG_ERRORS: "1"
        run: node research/optimizer/master-generation/master-large-context-gate.cjs all
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-master-40-rust-large-context
          path: research/optimizer/master-generation/master-large-context-results.json
          if-no-files-found: warn
          retention-days: 30
