name: Optimizer Master Target Stop

on:
  push:
    branches:
      - research/master-block4-target-stop-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run optimizer:rust:build
      - run: node --check research/optimizer/master-portfolio/master-target-stop.cjs
      - run: node research/optimizer/master-portfolio/master-target-stop.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-target-stop
          path: research/optimizer/master-portfolio/out/MASTER_TARGET_STOP_2026-09-21.json
