name: Kernel V1 v4 Beam policy wording fix
on:
  push:
    branches:
      - optimizer-kernel-v1-freeze
    paths:
      - .github/workflows/kernel-v1-v4-beam-policy-wording-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-kernel-v1-freeze
      - run: python3 scripts/kernel-freeze/.tmp-fix-beam-fallback-policy.py
      - run: python3 -m json.tool research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json > /dev/null
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json
          git commit -m 'docs(optimizer): align Beam fallback probe policy'
          git push
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git rm -f .github/workflows/kernel-v1-v4-beam-policy-wording-fix.yml scripts/kernel-freeze/.tmp-fix-beam-fallback-policy.py || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(optimizer): remove temporary Beam policy files [skip ci]'
            git push
          fi