name: Kernel V1 v4 controlled Beam fallback apply
on:
  push:
    branches: [optimizer-kernel-v1-freeze]
    paths: ['.github/workflows/kernel-v1-v4-controlled-beam-fallback-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-kernel-v1-freeze
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch v4 fallback semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('scripts/kernel-freeze/kernel-budget-calibration-v4.mjs')
          s = p.read_text()

          old = '''    const beamFallbackWarning = hasBeamFallbackWarning(result.stderrTail);
    const pass = Boolean('''
          new = '''    const beamFallback = classifyBeamFallback(result.stderrTail);
    const beamFallbackWarning = beamFallback.present;
    const beamFallbackAccepted = !beamFallback.present || (beamFallback.controlled && beamAccounting.ok);
    const pass = Boolean('''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('      !beamFallbackWarning\n    );', '      beamFallbackAccepted\n    );', 1)
          s = s.replace('      beamFallbackWarning,\n      pass,', '      beamFallbackWarning,\n      beamFallback,\n      beamFallbackAccepted,\n      pass,', 1)
          s = s.replace('beamFallbackWarning=${beamFallbackWarning}; stderr=', 'beamFallback=${JSON.stringify(beamFallback)}; stderr=', 1)

          old = '''    const beamFallbackWarning = hasBeamFallbackWarning(result.stderrTail);
    const valid = result.ok && result.validationOk && !result.cacheHit && result.pieces === result.expectedPieces && result.demandMultisetOk && telemetryWired && beamAccounting.ok && !beamFallbackWarning;'''
          new = '''    const beamFallback = classifyBeamFallback(result.stderrTail);
    const beamFallbackWarning = beamFallback.present;
    const beamFallbackAccepted = !beamFallback.present || (beamFallback.controlled && beamAccounting.ok);
    const valid = result.ok && result.validationOk && !result.cacheHit && result.pieces === result.expectedPieces && result.demandMultisetOk && telemetryWired && beamAccounting.ok && beamFallbackAccepted;'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('      beamFallbackWarning,\n      stderrTail:', '      beamFallbackWarning,\n      beamFallback,\n      beamFallbackAccepted,\n      stderrTail:', 1)

          old = '''function hasBeamFallbackWarning(stderrTail) {
  return /Beam Search falló, se usa greedy:/i.test(String(stderrTail ?? ""));
}'''
          new = '''function classifyBeamFallback(stderrTail) {
  const text = String(stderrTail ?? "");
  const present = /Beam Search falló, se usa greedy:/i.test(text);
  if (!present) return { present: false, controlled: false, classification: "NONE" };
  const controlled = /Beam Search falló, se usa greedy:[\\s\\S]*No se pudo completar el plan con Beam Search/i.test(text);
  return {
    present: true,
    controlled,
    classification: controlled ? "CONTROLLED_NO_COMPLETE_BEAM_PLAN" : "UNEXPECTED_BEAM_EXCEPTION",
  };
}'''
          assert old in s
          s = s.replace(old, new, 1)

          s = s.replace(
            'Any swallowed Beam fallback warning fails the probe.',
            'A controlled Beam no-complete-plan fallback is accepted only when the final result is valid and Beam work/terminal accounting is live; any other Beam exception remains fatal.',
          )
          s = s.replace(
            '"Beam calls may legitimately be zero when greedy already reaches the area lower bound; when Beam is called, v4 requires work/terminal-control accounting and rejects swallowed Beam fallbacks.",',
            '"Beam calls may legitimately be zero when greedy already reaches the area lower bound. A controlled no-complete-plan Beam fallback is legitimate candidate behavior when the final greedy result is valid and Beam work/terminal-control accounting is present; unexpected Beam exceptions remain fatal.",',
          )

          old = '''    engineMs: result.metrics.engineMs,
    cacheHit: Boolean(result.metrics.cacheHit),'''
          new = '''    engineMs: result.metrics.engineMs,
    profile: result.profile,
    cacheHit: Boolean(result.metrics.cacheHit),'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    historicalClassifierValidation: state.historicalReplay,
    aggregatePerOrderDistributions: {'''
          new = '''    historicalClassifierValidation: state.historicalReplay,
    calibrationProfilesObserved: [...new Set(rows.map((row) => row.profile ?? "balanced-v10-benchmark-default"))],
    historicalWallClockCeilings: {
      beamMs: 1500,
      masterMs: 8000,
      oneboardMs: 20000,
      note: "benchmarkInputFromCanonicalCase strategy=v10 defaults to balanced; balanced leaves motor Beam at its historical 1500ms default, while V10 Master defaults to 8000ms and OneBoard rescue to 20000ms.",
    },
    aggregatePerOrderDistributions: {'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          polp = Path('research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json')
          policy = json.loads(polp.read_text())
          policy['schemaVersion'] = 'kernel-v1-formal-certification-policy-v12'
          cp = policy['deterministicBudgets']['calibrationProtocol']
          cp['benchmarkProfile'] = 'benchmarkInputFromCanonicalCase(...,{strategy:"v10"}) defaults to profile=balanced. Historical calibration ceilings are therefore Beam 1500ms (motor default), Master 8000ms, OneBoard 20000ms.'
          cp['beamFallbackRule'] = 'The candidate explicitly degrades Beam to greedy when armarPlacasBeam throws. Calibration accepts only the controlled no-complete-plan error (message starts No se pudo completar el plan con Beam Search) when the final output remains valid and Beam work/terminal-control accounting is present. Any other Beam exception remains a calibration failure.'
          cp['beamTimeoutInterpretation'] = 'Beam timeoutHits is aggregated across Beam invocations. Under the v10 benchmark balanced profile the historical per-invocation Beam ceiling is 1500ms, not 2500ms. A case with timeoutHits>0 contains time-censored Beam work even if other invocations terminate normally.'
          polp.write_text(json.dumps(policy, indent=2, ensure_ascii=False) + '\n')
          PY
          node --check scripts/kernel-freeze/kernel-budget-calibration-v4.mjs
          python3 -m json.tool research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/kernel-freeze/kernel-budget-calibration-v4.mjs research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json
          git commit -m 'fix(optimizer): accept controlled Beam fallback during calibration'
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git rm -f .github/workflows/kernel-v1-v4-controlled-beam-fallback-apply.yml || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(optimizer): remove temporary Beam fallback workflow [skip ci]'
            git push
          fi