name: Kernel V1 budget candidate validation patch

on:
  push:
    branches:
      - optimizer-kernel-v1-freeze
    paths:
      - .github/workflows/kernel-v1-budget-candidate-validation-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: optimizer-kernel-v1-freeze
      - name: Apply patch
        run: python3 scripts/kernel-freeze/.tmp-add-budget-candidate-validation.py
      - name: Validate
        run: node --check scripts/kernel-freeze/kernel-budget-calibration-v4.mjs
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/kernel-freeze/kernel-budget-calibration-v4.mjs
          git rm scripts/kernel-freeze/.tmp-add-budget-candidate-validation.py
          git commit -m "feat(optimizer): add finite budget candidate validation gate"
          for attempt in 1 2 3 4 5; do
            git fetch origin optimizer-kernel-v1-freeze
            git rebase origin/optimizer-kernel-v1-freeze
            if git push origin HEAD:optimizer-kernel-v1-freeze; then
              exit 0
            fi
            sleep 2
          done
          exit 1
