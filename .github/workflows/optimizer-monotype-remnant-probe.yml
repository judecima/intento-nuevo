name: Optimizer Monotype Remnant Probe

on:
  push:
    branches:
      - research/perfv3-industrial-incremental-20260922
    paths:
      - research/optimizer/pattern-generators/monotype/concentrated-remnant-probe.mjs
      - .github/workflows/optimizer-monotype-remnant-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run monotype remnant probe
        run: node research/optimizer/pattern-generators/monotype/concentrated-remnant-probe.mjs
