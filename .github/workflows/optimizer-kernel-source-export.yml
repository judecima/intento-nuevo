name: Optimizer Kernel Source Snapshot Export

on:
  pull_request:
    branches:
      - optimizer-kernel-v1-freeze
    paths:
      - .github/workflows/optimizer-kernel-source-export.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify optimizer kernel identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git diff --quiet 4063963260abb10c8d68d0e553942899c925cc2f -- src/lib/optimizer

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build exact formal candidate bundle for mounted checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport
          node --input-type=module <<'NODE'
          import { build } from "esbuild";
          await build({
            entryPoints: ["src/lib/optimizer/index.ts"],
            bundle: true,
            platform: "node",
            format: "esm",
            target: "node22",
            outfile: "transport/kernel-v1-formal-candidate.mjs",
            define: {
              "import.meta.url": JSON.stringify("file:///mnt/data/kernel_repo/src/lib/optimizer/engine/legacy-engine.ts")
            },
            logLevel: "warning"
          });
          NODE
          sha256sum transport/kernel-v1-formal-candidate.mjs

      - name: Upload exact candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: kernel-v1-formal-bundle
          path: transport/kernel-v1-formal-candidate.mjs
          retention-days: 1
