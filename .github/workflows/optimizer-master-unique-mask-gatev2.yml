name: Optimizer Master Unique Mask GateV2

on:
  push:
    branches:
      - research/master-unique-mask-gatev2-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MASTER_GATE_MULT: "4.75"
      MASTER_GATE_MS: "8000"
      UNIQUE_MASK_LIMIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check research/optimizer/master-portfolio/master-unique-mask-gatev2.cjs
          node --check src/lib/optimizer/legacy/patrones.cjs
          node --check src/lib/optimizer/legacy/v10.cjs
      - name: Run Gate V2 survivor unique-mask A/B
        run: node research/optimizer/master-portfolio/master-unique-mask-gatev2.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-unique-mask-gatev2
          path: research/optimizer/master-portfolio/out/MASTER_UNIQUE_MASK_GATEV2_2026-09-21.json
