name: Kernel V1 v4 OneBoard static scan apply v2
on:
  push:
    branches: [optimizer-kernel-v1-freeze]
    paths: ['.github/workflows/kernel-v1-v4-oneboard-static-scan-apply-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-kernel-v1-freeze
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch calibration v4 OneBoard discovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('scripts/kernel-freeze/kernel-budget-calibration-v4.mjs')
          s = p.read_text()

          s, n = re.subn(
            r'  const oneboardQuota = args\.oneboardQuota == null \? 12 : nonNegativeInt\(args\.oneboardQuota, "--oneboardQuota"\);',
            '  const oneboardScanLimit = args.oneboardScanLimit == null\n    ? (args.oneboardQuota == null ? 48 : nonNegativeInt(args.oneboardQuota, "--oneboardQuota"))\n    : nonNegativeInt(args.oneboardScanLimit, "--oneboardScanLimit");',
            s, count=1)
          assert n == 1, f'arg replacement count={n}'

          s, n = re.subn(
            r'(  const state = await preparePhysicalCorpus\(bundle, corpus, out, historicalReplay\);\n)(  const hints = readHistoricalTimingHints\(\);)',
            r'''\1  const staticOneboardCandidates = state.feasible
              .filter((item) => staticAreaLowerBound(item.case) === 1)
              .sort(compareStaticOneboardCandidates);
            writeJson(join(out, "oneboard-static-candidates-v4.json"), {
              schemaVersion: "kernel-v1-oneboard-static-candidates-v4",
              generatedAt: new Date().toISOString(),
              executionBindingId: EXECUTION_BINDING_ID,
              rule: "Static candidates satisfy V10 cotaArea: ceil(sum(piece width*height*quantity) / historically usable board area) == 1. Current OneBoard activation still requires mejor.placas > 1 and is proven only by fresh oneboard telemetry.",
              feasibleCases: state.feasible.length,
              candidates: staticOneboardCandidates.length,
              likelyPackingHardByReferencePanelsGt1: staticOneboardCandidates.filter((item) => Number(item.referencePanels ?? 0) > 1).length,
              scanLimit: oneboardScanLimit,
              cases: staticOneboardCandidates.map((item) => ({ file: item.file, referencePanels: item.referencePanels, pieces: quantity(item.case), staticAreaLowerBound: 1 })),
            });
          \2''', s, count=1)
          assert n == 1, f'state insertion count={n}'

          s, n = re.subn(
            r'(const ordered = orderCalibration\(\s*state\.feasible,\s*hints,\s*policy\.execution\?\.knownExtremeTailOrders \?\? \[\],\s*activationHints,\s*calibrationOrder,\s*)oneboardQuota(,\s*\);)',
            r'\1oneboardScanLimit\2', s, count=1, flags=re.S)
          assert n == 1, f'order call replacement count={n}'

          s, n = re.subn(
            r'(      calibrationOrder,\n)      calibrationOneboardQuota: oneboardQuota,\n',
            r'\1      calibrationOneboardScanLimit: oneboardScanLimit,\n      calibrationOneboardSelection: "resto-static-area-lb1",\n      staticAreaLowerBound: staticAreaLowerBound(item.case),\n', s, count=1)
          assert n == 1, f'row replacement count={n}'

          s, n = re.subn(
            r'(    orderingModesObserved: \[\.\.\.new Set\(rows\.map\(\(row\) => row\.calibrationOrder \?\? "v4-pre-ordering-field"\)\)\],\n    oneboardQuotaValuesObserved: \[\.\.\.new Set\(rows\.map\(\(row\) => row\.calibrationOneboardQuota \?\? "v4-pre-oneboard-quota-field"\)\)\],\n)',
            r'''\1    oneboardScanLimitValuesObserved: [...new Set(rows.map((row) => row.calibrationOneboardScanLimit ?? "v4-pre-static-scan-field"))],
            oneboardDiscovery: {
              staticAreaLbOneCandidates: state.feasible.filter((item) => staticAreaLowerBound(item.case) === 1).length,
              staticAreaLbOneRowsCompleted: rows.filter((row) => Number(row.staticAreaLowerBound ?? 0) === 1).length,
              currentOneboardActivatedCases: rows.filter((row) => Number(row.step0?.oneboard?.runs ?? 0) > 0).length,
              currentOneboardMeasuredWorkCases: rows.filter((row) => Number(row.step0?.oneboard?.attemptsTotal ?? 0) > 0).length,
              selectionSource: "physical resto feasible cohort; static area lower bound under historical execution binding",
              interpretation: "Static areaLB=1 is only a cheap candidate filter. OneBoard evidence requires fresh oneboard.runs>0 and attemptsTotal>0. If an adequate scan yields no activations, record rarity and choose the rescue budget by explicit policy rather than fabricate a distribution.",
            },
          ''', s, count=1)
          assert n == 1, f'summary insertion count={n}'

          start = s.index('function orderCalibration(items, hints, tailOrders, activationHints, mode, oneboardQuota) {')
          end = s.index('\nfunction calibrationEnv()', start)
          replacement = r'''function orderCalibration(items, hints, tailOrders, activationHints, mode, oneboardScanLimit) {
            const tails = new Set(tailOrders.map(String));
            const isTail = (file) => [...tails].some((order) => file.includes(order));
            const hintFor = (file) => activationHints.get(file) ?? null;
            const anyHistoricallyActivated = (file) => {
              const hint = hintFor(file);
              return Boolean(hint && (hint.masterActivations > 0 || hint.oneboardActivations > 0));
            };
            const historicalMs = (file) => hints.get(file);
            const cheapComparator = (a, b) => {
              const ah = historicalMs(a.file), bh = historicalMs(b.file);
              if (Number.isFinite(ah) && Number.isFinite(bh) && ah !== bh) return ah - bh;
              if (Number.isFinite(ah) !== Number.isFinite(bh)) return Number.isFinite(ah) ? -1 : 1;
              const aq = quantity(a.case), bq = quantity(b.case);
              return aq - bq || cmp(a.file, b.file);
            };
            const workComparator = (a, b) => {
              const aa = anyHistoricallyActivated(a.file), ba = anyHistoricallyActivated(b.file);
              if (aa !== ba) return aa ? -1 : 1;
              const ah = historicalMs(a.file), bh = historicalMs(b.file);
              if (Number.isFinite(ah) && Number.isFinite(bh) && ah !== bh) return bh - ah;
              if (Number.isFinite(ah) !== Number.isFinite(bh)) return Number.isFinite(ah) ? -1 : 1;
              const aq = quantity(a.case), bq = quantity(b.case);
              return bq - aq || cmp(a.file, b.file);
            };

            const nonTails = items.filter((item) => !isTail(item.file));
            const tailItems = items.filter((item) => isTail(item.file)).sort(cheapComparator);
            if (mode === "cheap-first") return nonTails.sort(cheapComparator).concat(tailItems);

            const reservedOneboard = nonTails
              .filter((item) => staticAreaLowerBound(item.case) === 1)
              .sort(compareStaticOneboardCandidates)
              .slice(0, oneboardScanLimit);
            const reservedFiles = new Set(reservedOneboard.map((item) => item.file));
            const remaining = nonTails
              .filter((item) => !reservedFiles.has(item.file))
              .sort(workComparator);
            return reservedOneboard.concat(remaining, tailItems);
          }

          function staticAreaLowerBound(canonical) {
            const usefulWidth = Number(canonical?.panel?.width ?? 0) - Number(canonical?.trim?.x ?? 0);
            const usefulHeight = Number(canonical?.panel?.height ?? 0) - Number(canonical?.trim?.y ?? 0);
            const boardArea = usefulWidth * usefulHeight;
            if (!(boardArea > 0)) return Infinity;
            const demandArea = (canonical?.pieces ?? []).reduce(
              (sum, piece) => sum + Number(piece.width ?? 0) * Number(piece.height ?? 0) * Number(piece.quantity ?? 0),
              0,
            );
            return Math.ceil(demandArea / boardArea - 1e-9);
          }

          function compareStaticOneboardCandidates(a, b) {
            const aHard = Number(a.referencePanels ?? 0) > 1 ? 0 : 1;
            const bHard = Number(b.referencePanels ?? 0) > 1 ? 0 : 1;
            if (aHard !== bHard) return aHard - bHard;
            const aq = quantity(a.case), bq = quantity(b.case);
            return bq - aq || cmp(a.file, b.file);
          }'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          polp = Path('research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json')
          policy = json.loads(polp.read_text())
          policy['schemaVersion'] = 'kernel-v1-formal-certification-policy-v11'
          cp = policy['deterministicBudgets']['calibrationProtocol']
          cp['initialOrder'] = 'work-first with explicit OneBoard discovery from the physical resto cohort: statically filter feasible cases whose historical-execution-binding area lower bound is 1, prioritize referencePanels>1 then larger piece count, reserve up to 48 by default, then continue normal hotspot-driven work-first ordering; known extreme tails remain last. --oneboardScanLimit overrides the static scan size; legacy --oneboardQuota is accepted as an alias. Ordering changes priority only, never the exact 8,650-case universe.'
          cp['oneboardEvidenceRule'] = 'The 213-row hotspot marker has zero historical OneBoard activations and cannot source this evidence. OneBoard discovery starts from the physical resto feasible cohort using cotaArea==1 under the historical execution binding. Static candidacy is not activation evidence: promotion requires fresh current oneboard.runs>0 and attemptsTotal>0. If an adequate static scan yields no activations, document empirical rarity and set the rescue budget by explicit policy rather than inventing a distribution.'
          cp['samplingRule'] = 'Early --maxNew batches are stratified for evidence density: first a bounded physical-resto areaLB=1 OneBoard candidate scan, then hotspot-driven work-first calibration. This changes execution order only; the final certification universe remains the exact feasible subset of the fixed 8,650 resto cohort.'
          policy['execution']['ordering']['calibration'] = 'work-first stratified: up to 48 physical resto feasible cases with static areaLB=1 first (referencePanels>1, then piece count), then normal hotspot-driven work ordering; known extreme tail last. --oneboardScanLimit overrides scan size; --order cheap-first available. Final universe unchanged.'
          polp.write_text(json.dumps(policy, indent=2, ensure_ascii=False) + '\n')

          docp = Path('research/optimizer/freeze/KERNEL_V1_CALIBRATION_V4_WORK_FIRST_CHECKPOINT_2026-09-08.md')
          doc = docp.read_text()
          if '## OneBoard evidence source correction' not in doc:
            doc += '''\n## OneBoard evidence source correction\n\nThe 213 historical hotspot rows contain zero `oneboard.activaciones > 0`, including their `cota == 1` rows, so hotspot activation cannot source OneBoard calibration evidence.\n\nCalibration v4 now derives the early OneBoard discovery stratum directly from the exact physical `resto` feasible cohort. It statically selects `areaLB == 1` under the historical execution binding and prioritizes `referencePanels > 1` then larger piece counts. The default bounded scan is 48 candidates (`--oneboardScanLimit`); legacy `--oneboardQuota` remains an alias.\n\nStatic candidacy is only a cheap prerequisite. Empirical evidence requires a fresh current run with `oneboard.runs > 0` and `oneboard.attemptsTotal > 0`. If an adequate scan yields no activation, record rarity and use a policy-defined rescue budget instead of fabricating an empirical distribution.\n'''
          docp.write_text(doc)
          PY
          node --check scripts/kernel-freeze/kernel-budget-calibration-v4.mjs
          python3 -m json.tool research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json >/dev/null
          git add scripts/kernel-freeze/kernel-budget-calibration-v4.mjs research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json research/optimizer/freeze/KERNEL_V1_CALIBRATION_V4_WORK_FIRST_CHECKPOINT_2026-09-08.md
          git commit -m 'fix(optimizer): discover OneBoard candidates from resto'
          git push
      - name: Remove temporary workflows
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git rm -f .github/workflows/kernel-v1-v4-oneboard-static-scan-apply.yml .github/workflows/kernel-v1-v4-oneboard-static-scan-apply-v2.yml || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(optimizer): remove temporary OneBoard discovery workflows [skip ci]'
            git push
          fi
