name: Optimizer kernel Candidate A guard

on:
  push:
    branches:
      - optimizer-kernel-v1-stabilization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-a-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert linked traces are the runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q '_diagLink' src/lib/optimizer/legacy/motor.cjs
          grep -q 'resolverDiagPath' src/lib/optimizer/legacy/motor.cjs
          grep -q '_diagLink' src/lib/optimizer/engine/legacy-engine.ts
          if grep -q 'trazaDiag: false' src/lib/optimizer/legacy/patrones.cjs; then
            echo 'Candidate A invariant failed: Master suppresses diagnostic trace' >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Candidate A trace contracts
        run: npx vitest run tests/optimizer/pattern-trace.test.ts tests/optimizer/diag-trace.test.ts tests/optimizer/optimizer.test.ts
