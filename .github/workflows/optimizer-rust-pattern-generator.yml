name: Optimizer Rust Pattern Generator

on:
  push:
    branches:
      - feature/optimizer-rust-pattern-generator
      - feature/optimizer-rust-legacy-pattern-generator
      - feature/optimizer-rust-worker-candidate
      - experiment/optimizer-rust-choice-state-memo
  pull_request:
    branches:
      - prototipo-inicial
      - experiment/optimizer-dff-fs0-lb
    paths:
      - "native/optimizer-pattern-generator/**"
      - "research/optimizer/pattern-generators/rust/**"
      - "scripts/install-rust-pattern-generator.mjs"
      - "tests/optimizer/rust-pattern-generator.test.ts"
      - "src/lib/optimizations/worker.ts"
      - "src/lib/optimizations/run.ts"
      - "src/lib/optimizer/engine/legacy-engine.ts"
      - "src/lib/optimizer/legacy/patrones.cjs"
      - "src/lib/optimizer/legacy/rust/**"
      - "tests/optimizer/rust-worker-routing.test.ts"
      - "tests/security/server-only.test.ts"
      - "package.json"
      - ".github/workflows/optimizer-rust-pattern-generator.yml"

permissions:
  contents: read

jobs:
  rust-pattern-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --manifest-path native/optimizer-pattern-generator/Cargo.toml
      - run: npm run optimizer:rust:build
      - uses: actions/upload-artifact@v4
        with:
          name: optimizer-rust-linux-x64
          path: |
            native/optimizer-pattern-generator/optimizer_pattern_generator.node
            research/optimizer/pattern-generators/rust/legacy-hybrid-engine.mjs
            research/optimizer/pattern-generators/rust/legacy-packer-adapter.mjs
            research/optimizer/pattern-generators/rust/legacy-outer-adapter.mjs
          if-no-files-found: error
          retention-days: 7
      - run: REQUIRE_RUST_PATTERN_GENERATOR=1 npx vitest run tests/optimizer/rust-pattern-generator.test.ts
      - run: REQUIRE_RUST_PATTERN_GENERATOR=1 npx vitest run tests/optimizer/rust-legacy-packer.test.ts tests/optimizer/rust-legacy-hybrid.test.ts
      - run: REQUIRE_RUST_PATTERN_GENERATOR=1 npx vitest run tests/optimizer/rust-worker-routing.test.ts
      - run: RUST_LEGACY_DEBUG_ERRORS=1 node research/optimizer/pattern-generators/rust/benchmark-4057401.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Benchmark p99 stable pool candidate
        run: P99_BENCH_LABEL=candidate P99_BENCH_CASE=4059795 node research/optimizer/pattern-generators/rust/benchmark-p99-stable-pool.mjs | tee /tmp/p99-candidate.json
      - name: Benchmark p99 Rust base
        run: |
          git show 6af43e2766b6b0a9d5946bec64b59c20e988757c:native/optimizer-pattern-generator/src/legacy_packer.rs > native/optimizer-pattern-generator/src/legacy_packer.rs
          npm run optimizer:rust:build
          P99_BENCH_LABEL=base P99_BENCH_CASE=4059795 node research/optimizer/pattern-generators/rust/benchmark-p99-stable-pool.mjs | tee /tmp/p99-base.json
      - name: Compare p99 stable pool
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const candidate = JSON.parse(fs.readFileSync('/tmp/p99-candidate.json', 'utf8').trim().split('\n').at(-1));
          const base = JSON.parse(fs.readFileSync('/tmp/p99-base.json', 'utf8').trim().split('\n').at(-1));
          if (candidate.digest !== base.digest || candidate.patterns !== base.patterns) {
            throw new Error('p99 pool parity regression');
          }
          const speedup = base.ms / candidate.ms;
          console.log(JSON.stringify({
            ok: true,
            benchmark: 'p99-stable-pool-ab-v1',
            order: candidate.order,
            patterns: candidate.patterns,
            baseMs: base.ms,
            candidateMs: candidate.ms,
            speedup: +speedup.toFixed(3),
            savingPct: +((1 - candidate.ms / base.ms) * 100).toFixed(2),
            digest: candidate.digest,
          }));
          NODE
