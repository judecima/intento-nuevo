name: Optimizer Incremental +4 Win Curves

on:
  push:
    branches:
      - research/perfv3-industrial-incremental-20260922
    paths:
      - "research/optimizer/master-generation/master40-incremental-curve.cjs"
      - ".github/workflows/optimizer-incremental-win-curves.yml"

permissions:
  contents: read
  actions: read

env:
  FREEZE_RUN_ID: "35663298999"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p research/optimizer/master-generation
          gh run download "$FREEZE_RUN_ID" --repo "$GH_REPO" --name perfv1-master-win-frozen-manifest --dir research/optimizer/master-generation
          test -f research/optimizer/master-generation/master-win-frozen-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: incremental-curve-input
          path: research/optimizer/master-generation/master-win-frozen-manifest.json
          if-no-files-found: error
          retention-days: 7

  shard:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run optimizer:rust:build
      - uses: actions/download-artifact@v4
        with:
          name: incremental-curve-input
          path: research/optimizer/master-generation
      - name: Incremental curve shard ${{ matrix.shard }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 8
          RUST_LEGACY_DEBUG_ERRORS: "1"
        run: node research/optimizer/master-generation/master40-incremental-curve.cjs shard
      - uses: actions/upload-artifact@v4
        with:
          name: master40-incremental-curve-shard-${{ matrix.shard }}
          path: research/optimizer/master-generation/master40-incremental-curve-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  report:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: master40-incremental-curve-shard-*
          path: research/optimizer/master-generation
          merge-multiple: true
      - name: Build incremental curve report
        env:
          SHARD_TOTAL: 8
        run: node research/optimizer/master-generation/master40-incremental-curve.cjs report
      - uses: actions/upload-artifact@v4
        with:
          name: master40-incremental-curve-results
          path: research/optimizer/master-generation/master40-incremental-curve-results.json
          if-no-files-found: error
          retention-days: 7
