name: Optimizer PreMaster Cheap LB

on:
  push:
    branches:
      - experiment/optimizer-premaster-cheap-lb
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PreMaster cheap LB contract
        run: npx vitest run tests/optimizer/premaster-cheap-lb.test.ts
      - run: npm run typecheck
      - run: npm test
