name: Optimizer worker spike

on:
  push:
    branches:
      - optimizer-worker-isolation-spike
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Optimizer unit tests
        run: npx vitest run tests/optimizer/optimizer.test.ts tests/optimizer/pattern-trace.test.ts tests/optimizer/executor.test.ts

      - name: Direct vs Worker full-plan smoke
        run: node scripts/optimizer-worker-smoke.mjs

      - name: Next production build
        run: npm run build
