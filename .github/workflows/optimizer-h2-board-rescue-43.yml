name: Optimizer H2 Board Rescue 43

on:
  push:
    branches:
      - research/perfv3-industrial-incremental-20260922
    paths:
      - research/optimizer/pattern-generators/guide-row/integrated-v10-h2-board-rescue.mjs
      - research/optimizer/pattern-generators/guide-row/h2-board-rescue-43-ab.mjs
      - research/optimizer/pattern-generators/guide-row/fixtures/HISTORICAL_43_LEPTON_GAPS.json.gz.b64
      - .github/workflows/optimizer-h2-board-rescue-43.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run optimizer:rust:build
      - name: Run strict H2 board rescue A/B
        run: node research/optimizer/pattern-generators/guide-row/h2-board-rescue-43-ab.mjs
