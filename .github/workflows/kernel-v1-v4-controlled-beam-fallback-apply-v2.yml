name: Kernel V1 v4 controlled Beam fallback apply v2
on:
  push:
    branches:
      - optimizer-kernel-v1-freeze
    paths:
      - .github/workflows/kernel-v1-v4-controlled-beam-fallback-apply-v2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-kernel-v1-freeze
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/kernel-freeze/.tmp-apply-controlled-beam-fallback.py
      - run: node --check scripts/kernel-freeze/kernel-budget-calibration-v4.mjs
      - run: python3 -m json.tool research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json > /dev/null
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/kernel-freeze/kernel-budget-calibration-v4.mjs research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json
          git commit -m 'fix(optimizer): accept controlled Beam fallback during calibration'
          git push
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git rm -f .github/workflows/kernel-v1-v4-controlled-beam-fallback-apply-v2.yml scripts/kernel-freeze/.tmp-apply-controlled-beam-fallback.py || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(optimizer): remove temporary Beam fallback patch files [skip ci]'
            git push
          fi