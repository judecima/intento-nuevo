name: Optimizer Master40 Simple Choose

on:
  push:
    branches:
      - research/master40-simple-choose-20260921
    paths:
      - "native/optimizer-pattern-generator/src/legacy_packer.rs"
      - "research/optimizer/master-generation/simple-choose-gate.cjs"
      - ".github/workflows/optimizer-master40-simple-choose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build native optimizer
        run: npm run optimizer:rust:build
      - name: Run simple-choose parity gate
        env:
          RUST_LEGACY_DEBUG_ERRORS: "1"
        run: node research/optimizer/master-generation/simple-choose-gate.cjs all
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-master40-simple-choose
          path: research/optimizer/master-generation/simple-choose-results.json
          if-no-files-found: warn
          retention-days: 30
