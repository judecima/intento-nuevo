name: Optimizer Guide-Core Master

on:
  push:
    branches:
      - experiment/optimizer-guide-core-master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --manifest-path native/optimizer-pattern-generator/Cargo.toml
      - run: npm run optimizer:rust:build
      - name: Guide-Core contract
        run: node --test research/optimizer/pattern-generators/guide-core/guide-core-master.test.mjs
      - run: npm run typecheck
      - run: npm test
