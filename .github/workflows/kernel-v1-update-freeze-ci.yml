name: Kernel V1 update freeze CI

on:
  push:
    branches:
      - optimizer-kernel-v1-freeze
    paths:
      - .github/workflows/kernel-v1-update-freeze-ci.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: optimizer-kernel-v1-freeze
      - name: Patch main freeze workflow
        run: python3 scripts/kernel-freeze/.tmp-update-freeze-ci-after-budget-promotion.py
      - name: Validate patched workflow references
        run: |
          node --check scripts/kernel-freeze/formal-correctness-v1.mjs
          grep -q 'FORMAL_CERTIFICATION_POLICY_READY=true' .github/workflows/optimizer-kernel-freeze.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/optimizer-kernel-freeze.yml
          git rm scripts/kernel-freeze/.tmp-update-freeze-ci-after-budget-promotion.py
          git commit -m "ci(optimizer): transition freeze checks to formal-ready state"
          for attempt in 1 2 3 4 5; do
            git fetch origin optimizer-kernel-v1-freeze
            git rebase origin/optimizer-kernel-v1-freeze
            if git push origin HEAD:optimizer-kernel-v1-freeze; then
              exit 0
            fi
            sleep 2
          done
          exit 1
