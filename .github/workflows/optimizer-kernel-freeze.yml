name: Optimizer Kernel V1 Freeze

on:
  push:
    branches:
      - optimizer-kernel-v1-freeze
    paths:
      - .github/workflows/optimizer-kernel-freeze.yml
      - scripts/kernel-freeze/**
      - research/optimizer/determinism/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: optimizer-kernel-v1-freeze

      - name: Inspect embedded canonical corpus
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'experiencia/canonical_cases.json';
          const s = fs.statSync(p);
          const raw = fs.readFileSync(p, 'utf8');
          const data = JSON.parse(raw);
          const type = Array.isArray(data) ? 'array' : typeof data;
          const count = Array.isArray(data) ? data.length : (data && typeof data === 'object' ? Object.keys(data).length : null);
          const first = Array.isArray(data) ? data[0] : (data && typeof data === 'object' ? data[Object.keys(data)[0]] : null);
          const firstKey = !Array.isArray(data) && data && typeof data === 'object' ? Object.keys(data)[0] : null;
          console.log(JSON.stringify({bytes:s.size,type,count,firstKey,firstKeys:first&&typeof first==='object'?Object.keys(first):[],firstSample:first&&typeof first==='object'?Object.fromEntries(Object.entries(first).slice(0,8)):first}, null, 2));
          NODE
