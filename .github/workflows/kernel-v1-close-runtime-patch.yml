name: Kernel V1 close runtime patch

on:
  push:
    branches:
      - optimizer-kernel-v1-freeze
    paths:
      - .github/workflows/kernel-v1-close-runtime-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: optimizer-kernel-v1-freeze
      - name: Apply patch
        run: python3 scripts/kernel-freeze/.tmp-close-runtime-and-propose-budgets.py
      - name: Validate tooling and policy
        run: |
          node --check scripts/kernel-freeze/kernel-budget-calibration-v4.mjs
          node -e "JSON.parse(require('fs').readFileSync('research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json','utf8')); console.log('policy json ok')"
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/kernel-freeze/kernel-budget-calibration-v4.mjs
          git add research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json
          git rm scripts/kernel-freeze/.tmp-close-runtime-and-propose-budgets.py
          git commit -m "feat(optimizer): close runtime planning and propose Kernel V1 budgets"
          for attempt in 1 2 3 4 5; do
            git fetch origin optimizer-kernel-v1-freeze
            git rebase origin/optimizer-kernel-v1-freeze
            if git push origin HEAD:optimizer-kernel-v1-freeze; then
              exit 0
            fi
            sleep 2
          done
          exit 1
