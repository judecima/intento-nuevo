name: Optimizer Guide-Row H2c Hotspot

on:
  push:
    branches:
      - research/perfv3-industrial-incremental-20260922
    paths:
      - research/optimizer/pattern-generators/guide-row/h2c-hotspot-benchmark.mjs
      - research/optimizer/pattern-generators/guide-row/complete-candidate.mjs
      - research/optimizer/pattern-generators/guide-row/residual-builder.mjs
      - .github/workflows/optimizer-guide-row-h2c-hotspot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run optimizer:rust:build
      - name: H2c shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 8
          MAX_PIECES: 160
        run: node research/optimizer/pattern-generators/guide-row/h2c-hotspot-benchmark.mjs shard
      - uses: actions/upload-artifact@v4
        with:
          name: h2c-hotspot-shard-${{ matrix.shard }}
          path: research/optimizer/pattern-generators/guide-row/h2c-hotspot-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  report:
    runs-on: ubuntu-latest
    needs: shard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: h2c-hotspot-shard-*
          path: research/optimizer/pattern-generators/guide-row
          merge-multiple: true
      - name: H2c report
        env:
          SHARD_TOTAL: 8
        run: node research/optimizer/pattern-generators/guide-row/h2c-hotspot-benchmark.mjs report
      - uses: actions/upload-artifact@v4
        with:
          name: h2c-hotspot-results
          path: research/optimizer/pattern-generators/guide-row/h2c-hotspot-results.json
          if-no-files-found: error
          retention-days: 7
