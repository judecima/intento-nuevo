name: Optimizer Blind Rule B Over500

on:
  push:
    branches:
      - research/perfv3-industrial-incremental-20260922
    paths:
      - "research/optimizer/master-generation/mid-repeat-blind-over500.cjs"
      - ".github/workflows/optimizer-blind-rule-b-over500.yml"

permissions:
  contents: read

jobs:
  blind:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run optimizer:rust:build
      - name: Blind Rule B >500 shard ${{ matrix.shard }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 8
          RUST_LEGACY_DEBUG_ERRORS: "1"
        run: node research/optimizer/master-generation/mid-repeat-blind-over500.cjs blind
      - uses: actions/upload-artifact@v4
        with:
          name: blind-rule-b-over500-shard-${{ matrix.shard }}
          path: research/optimizer/master-generation/mid-repeat-blind-over500-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  report:
    needs: blind
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: blind-rule-b-over500-shard-*
          path: research/optimizer/master-generation
          merge-multiple: true
      - name: Build blind Rule B report
        env:
          SHARD_TOTAL: 8
        run: node research/optimizer/master-generation/mid-repeat-blind-over500.cjs report
      - uses: actions/upload-artifact@v4
        with:
          name: blind-rule-b-over500-results
          path: research/optimizer/master-generation/mid-repeat-blind-over500-results.json
          if-no-files-found: error
          retention-days: 7
