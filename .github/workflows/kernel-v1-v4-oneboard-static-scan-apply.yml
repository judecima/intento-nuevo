name: Kernel V1 v4 OneBoard static scan apply
on:
  push:
    branches: [optimizer-kernel-v1-freeze]
    paths: ['.github/workflows/kernel-v1-v4-oneboard-static-scan-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimizer-kernel-v1-freeze
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch calibration v4 OneBoard discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('scripts/kernel-freeze/kernel-budget-calibration-v4.mjs')
          s = p.read_text()

          old = '  const oneboardQuota = args.oneboardQuota == null ? 12 : nonNegativeInt(args.oneboardQuota, "--oneboardQuota");'
          new = '''  const oneboardScanLimit = args.oneboardScanLimit == null
            ? (args.oneboardQuota == null ? 48 : nonNegativeInt(args.oneboardQuota, "--oneboardQuota"))
            : nonNegativeInt(args.oneboardScanLimit, "--oneboardScanLimit");'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  const state = await preparePhysicalCorpus(bundle, corpus, out, historicalReplay);
          const hints = readHistoricalTimingHints();'''
          new = '''  const state = await preparePhysicalCorpus(bundle, corpus, out, historicalReplay);
          const staticOneboardCandidates = state.feasible
            .filter((item) => staticAreaLowerBound(item.case) === 1)
            .sort(compareStaticOneboardCandidates);
          writeJson(join(out, "oneboard-static-candidates-v4.json"), {
            schemaVersion: "kernel-v1-oneboard-static-candidates-v4",
            generatedAt: new Date().toISOString(),
            executionBindingId: EXECUTION_BINDING_ID,
            rule: "Static candidates satisfy the same V10 cotaArea formula: ceil(sum(piece width*height*quantity) / historically usable board area) == 1. Current OneBoard activation still requires the live V10 condition mejor.placas > 1 and is proven only by oneboard.runs/attempts telemetry.",
            feasibleCases: state.feasible.length,
            candidates: staticOneboardCandidates.length,
            likelyPackingHardByReferencePanelsGt1: staticOneboardCandidates.filter((item) => Number(item.referencePanels ?? 0) > 1).length,
            scanLimit: oneboardScanLimit,
            cases: staticOneboardCandidates.map((item) => ({
              file: item.file,
              referencePanels: item.referencePanels,
              pieces: quantity(item.case),
              staticAreaLowerBound: 1,
            })),
          });
          const hints = readHistoricalTimingHints();'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    activationHints,
            calibrationOrder,
            oneboardQuota,
          );'''
          new = '''    activationHints,
            calibrationOrder,
            oneboardScanLimit,
          );'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''      calibrationOrder,
                calibrationOneboardQuota: oneboardQuota,
                file: item.file,'''
          new = '''      calibrationOrder,
                calibrationOneboardScanLimit: oneboardScanLimit,
                calibrationOneboardSelection: "resto-static-area-lb1",
                staticAreaLowerBound: staticAreaLowerBound(item.case),
                file: item.file,'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    orderingModesObserved: [...new Set(rows.map((row) => row.calibrationOrder ?? "v4-pre-ordering-field"))],
              oneboardQuotaValuesObserved: [...new Set(rows.map((row) => row.calibrationOneboardQuota ?? "v4-pre-oneboard-quota-field"))],
              budgetParameterSemantics: {'''
          new = '''    orderingModesObserved: [...new Set(rows.map((row) => row.calibrationOrder ?? "v4-pre-ordering-field"))],
              oneboardQuotaValuesObserved: [...new Set(rows.map((row) => row.calibrationOneboardQuota ?? "v4-pre-oneboard-quota-field"))],
              oneboardScanLimitValuesObserved: [...new Set(rows.map((row) => row.calibrationOneboardScanLimit ?? "v4-pre-static-scan-field"))],
              oneboardDiscovery: {
                staticAreaLbOneCandidates: state.feasible.filter((item) => staticAreaLowerBound(item.case) === 1).length,
                staticAreaLbOneRowsCompleted: rows.filter((row) => Number(row.staticAreaLowerBound ?? 0) === 1).length,
                currentOneboardActivatedCases: rows.filter((row) => Number(row.step0?.oneboard?.runs ?? 0) > 0).length,
                currentOneboardMeasuredWorkCases: rows.filter((row) => Number(row.step0?.oneboard?.attemptsTotal ?? 0) > 0).length,
                selectionSource: "physical resto feasible cohort; static area lower bound under historical execution binding",
                interpretation: "Static areaLB=1 is only a cheap candidate filter. OneBoard evidence requires current-run oneboard.runs > 0 and attemptsTotal > 0; if adequate static scanning yields no activations, record rarity and choose the production rescue budget by explicit policy rather than fabricating an empirical distribution.",
              },
              budgetParameterSemantics: {'''
          assert old in s
          s = s.replace(old, new, 1)

          start = s.index('function orderCalibration(items, hints, tailOrders, activationHints, mode, oneboardQuota) {')
          end = s.index('\nfunction calibrationEnv()', start)
          replacement = r'''function orderCalibration(items, hints, tailOrders, activationHints, mode, oneboardScanLimit) {
            const tails = new Set(tailOrders.map(String));
            const isTail = (file) => [...tails].some((order) => file.includes(order));
            const hintFor = (file) => activationHints.get(file) ?? null;
            const anyHistoricallyActivated = (file) => {
              const hint = hintFor(file);
              return Boolean(hint && (hint.masterActivations > 0 || hint.oneboardActivations > 0));
            };
            const historicalMs = (file) => hints.get(file);
            const cheapComparator = (a, b) => {
              const ah = historicalMs(a.file), bh = historicalMs(b.file);
              if (Number.isFinite(ah) && Number.isFinite(bh) && ah !== bh) return ah - bh;
              if (Number.isFinite(ah) !== Number.isFinite(bh)) return Number.isFinite(ah) ? -1 : 1;
              const aq = quantity(a.case), bq = quantity(b.case);
              return aq - bq || cmp(a.file, b.file);
            };
            const workComparator = (a, b) => {
              const aa = anyHistoricallyActivated(a.file), ba = anyHistoricallyActivated(b.file);
              if (aa !== ba) return aa ? -1 : 1;
              const ah = historicalMs(a.file), bh = historicalMs(b.file);
              if (Number.isFinite(ah) && Number.isFinite(bh) && ah !== bh) return bh - ah;
              if (Number.isFinite(ah) !== Number.isFinite(bh)) return Number.isFinite(ah) ? -1 : 1;
              const aq = quantity(a.case), bq = quantity(b.case);
              return bq - aq || cmp(a.file, b.file);
            };

            const nonTails = items.filter((item) => !isTail(item.file));
            const tailItems = items.filter((item) => isTail(item.file)).sort(cheapComparator);
            if (mode === "cheap-first") return nonTails.sort(cheapComparator).concat(tailItems);

            // Hotspot evidence contains no historical OneBoard activations. Discover
            // the rare path directly from the physical resto cohort using V10's cheap
            // static prerequisite cotaArea==1. Prefer referencePanels>1 because those
            // are more likely to be packing-hard despite fitting by area; then larger
            // piece counts. Current telemetry, not this filter, proves activation.
            const reservedOneboard = nonTails
              .filter((item) => staticAreaLowerBound(item.case) === 1)
              .sort(compareStaticOneboardCandidates)
              .slice(0, oneboardScanLimit);
            const reservedFiles = new Set(reservedOneboard.map((item) => item.file));
            const remaining = nonTails
              .filter((item) => !reservedFiles.has(item.file))
              .sort(workComparator);
            return reservedOneboard.concat(remaining, tailItems);
          }

          function staticAreaLowerBound(canonical) {
            const usefulWidth = Number(canonical?.panel?.width ?? 0) - Number(canonical?.trim?.x ?? 0);
            const usefulHeight = Number(canonical?.panel?.height ?? 0) - Number(canonical?.trim?.y ?? 0);
            const boardArea = usefulWidth * usefulHeight;
            if (!(boardArea > 0)) return Infinity;
            const demandArea = (canonical?.pieces ?? []).reduce(
              (sum, piece) => sum + Number(piece.width ?? 0) * Number(piece.height ?? 0) * Number(piece.quantity ?? 0),
              0,
            );
            return Math.ceil(demandArea / boardArea - 1e-9);
          }

          function compareStaticOneboardCandidates(a, b) {
            const aHard = Number(a.referencePanels ?? 0) > 1 ? 0 : 1;
            const bHard = Number(b.referencePanels ?? 0) > 1 ? 0 : 1;
            if (aHard !== bHard) return aHard - bHard;
            const aq = quantity(a.case), bq = quantity(b.case);
            return bq - aq || cmp(a.file, b.file);
          }'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          polp = Path('research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json')
          policy = json.loads(polp.read_text())
          policy['schemaVersion'] = 'kernel-v1-formal-certification-policy-v11'
          cp = policy['deterministicBudgets']['calibrationProtocol']
          cp['initialOrder'] = 'work-first with explicit OneBoard discovery from the physical resto cohort: statically filter feasible cases whose historical-execution-binding area lower bound is 1, prioritize referencePanels>1 then larger piece count, reserve up to 48 by default, then continue normal hotspot-driven work-first ordering; known extreme tails remain last. --oneboardScanLimit overrides the static scan size; legacy --oneboardQuota is accepted as an alias. Ordering changes priority only, never the exact 8,650-case universe.'
          cp['oneboardEvidenceRule'] = 'The 213-row hotspot marker has zero historical OneBoard activations and cannot source this evidence. OneBoard discovery must therefore start from the physical resto feasible cohort using the cheap static prerequisite cotaArea==1 under the versioned historical execution binding. Static candidacy is not activation evidence: promotion requires fresh current oneboard.runs>0 and attemptsTotal>0. If an adequately sized static scan still yields no activations, document empirical rarity and set the rescue budget by explicit policy rather than inventing a distribution.'
          cp['samplingRule'] = 'Early --maxNew batches are stratified for evidence density: first a bounded physical-resto areaLB=1 OneBoard candidate scan, then hotspot-driven work-first calibration. This is an ordering/sampling-efficiency device only; production budget promotion still requires adequate path/tail evidence and the final certification universe remains the exact feasible subset of the fixed 8,650 resto cohort.'
          policy['execution']['ordering']['calibration'] = 'work-first stratified: up to 48 physical resto feasible cases with static areaLB=1 first (referencePanels>1, then piece count), then normal hotspot-driven Master/activated work ordering; known extreme tail last. --oneboardScanLimit overrides scan size; --order cheap-first available. Final universe unchanged.'
          polp.write_text(json.dumps(policy, indent=2, ensure_ascii=False) + '\n')

          docp = Path('research/optimizer/freeze/KERNEL_V1_CALIBRATION_V4_WORK_FIRST_CHECKPOINT_2026-09-08.md')
          doc = docp.read_text()
          doc += '''\n## OneBoard evidence source correction\n\nThe 213 historical hotspot rows contain zero `oneboard.activaciones > 0`, including the few rows with `cota == 1`. Therefore hotspot activation cannot provide OneBoard calibration evidence.\n\nCalibration v4 now derives an early OneBoard discovery stratum directly from the exact physical `resto` feasible cohort. It statically selects `areaLB == 1` under the same historical execution binding and prioritizes `referencePanels > 1` followed by larger piece counts. The default bounded scan is 48 candidates (`--oneboardScanLimit`). The legacy `--oneboardQuota` argument remains an alias for compatibility.\n\nThe static filter is only a cheap prerequisite. A case counts as empirical OneBoard evidence only when the fresh current run records `oneboard.runs > 0` and measured `oneboard.attemptsTotal > 0`. If an adequate scan yields no activation, the correct conclusion is empirical rarity and a policy-defined rescue budget, not a fabricated empirical distribution.\n'''
          docp.write_text(doc)
          PY
          node --check scripts/kernel-freeze/kernel-budget-calibration-v4.mjs
          python3 -m json.tool research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json >/dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/kernel-freeze/kernel-budget-calibration-v4.mjs research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json research/optimizer/freeze/KERNEL_V1_CALIBRATION_V4_WORK_FIRST_CHECKPOINT_2026-09-08.md
          git commit -m 'fix(optimizer): discover OneBoard candidates from resto'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git pull --rebase || true
          git rm -f .github/workflows/kernel-v1-v4-oneboard-static-scan-apply.yml || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(optimizer): remove temporary OneBoard discovery workflow [skip ci]'
            git push
          fi
