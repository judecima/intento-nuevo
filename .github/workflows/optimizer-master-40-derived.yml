name: Optimizer Master 40 Round Derived Metrics

on:
  push:
    branches:
      - research/master-generation-tail-20260920
    paths:
      - "src/lib/optimizer/legacy/rust/rust-hybrid.cjs"
      - "research/optimizer/master-generation/derived-metrics-gate.cjs"
      - ".github/workflows/optimizer-master-40-derived.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build native optimizer
        run: npm run optimizer:rust:build
      - name: Run 40-round derived-metrics parity gate
        env:
          RUST_LEGACY_DEBUG_ERRORS: "1"
        run: node research/optimizer/master-generation/derived-metrics-gate.cjs all
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-master-40-derived-metrics
          path: research/optimizer/master-generation/derived-metrics-results.json
          if-no-files-found: warn
          retention-days: 30
