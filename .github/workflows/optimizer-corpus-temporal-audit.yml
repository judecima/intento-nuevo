name: Optimizer Corpus Temporal Audit

on:
  push:
    branches:
      - research/perfv1-master-win-mining-20260921
    paths:
      - "research/optimizer/master-generation/corpus-temporal-audit.cjs"
      - ".github/workflows/optimizer-corpus-temporal-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit temporal fields
        run: node research/optimizer/master-generation/corpus-temporal-audit.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-temporal-audit
          path: research/optimizer/master-generation/corpus-temporal-audit.json
          if-no-files-found: error
          retention-days: 7
