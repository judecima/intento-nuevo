name: Optimizer Unique Mask Research

on:
  push:
    branches:
      - experiment/optimizer-master-unique-masks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --manifest-path native/optimizer-pattern-generator/Cargo.toml
      - run: npm run optimizer:rust:build
      - name: Rust routing contract
        run: npx vitest run tests/optimizer/rust-worker-routing.test.ts tests/optimizer/rust-legacy-hybrid.test.ts tests/optimizer/rust-legacy-outer.test.ts
      - name: Upload certified native addon
        uses: actions/upload-artifact@v4
        with:
          name: unique-mask-native-x64
          path: native/optimizer-pattern-generator/optimizer_pattern_generator.node
          if-no-files-found: error
          retention-days: 7
