name: Kernel V1 v4 work-first apply

on:
  push:
    branches:
      - optimizer-kernel-v1-freeze
    paths:
      - .github/workflows/kernel-v1-v4-work-first-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: optimizer-kernel-v1-freeze
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/kernel_v1_v4_work_first.py
          node --check scripts/kernel-freeze/kernel-budget-calibration-v4.mjs
          node -e "const p=require('./research/optimizer/freeze/KERNEL_V1_FORMAL_CERTIFICATION_POLICY.json'); if(p.deterministicBudgets.calibrationProtocol.authoritativeHarness!=='scripts/kernel-freeze/kernel-budget-calibration-v4.mjs') process.exit(1); if(!p.deterministicBudgets.calibrationProtocol.budgetScopeRule) process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(optimizer): align v4 calibration with per-invocation budgets"
          git push origin HEAD:optimizer-kernel-v1-freeze
